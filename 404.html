<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PCB App - Connect with professionals and community posts.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PCB App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PCB App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Smart Deep Link & Play Store Redirection Script for Mobile -->
  <!-- Smart Deep Link & Play Store Redirection Script for Mobile -->
  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      const hash = window.location.hash;

      // If mobile user clicks a post deep link
      if (hash.includes('/post/') && /Android/i.test(navigator.userAgent)) {
        const postId = hash.split('/post/')[1];

        // Use your correct Android package ID here
        const packageName = 'com.rxai.pcb'; // Update if your package ID is different

        // Valid Android Intent structure
        const appSchemeUrl = `intent://codninesx-maker.github.io/pcb-app/#/post/${postId}#Intent;scheme=https;package=${packageName};end;`;

        // Correct, working Google Play Store web link format
        const playStoreUrl = `https://play.google.com/store/apps/details?id=${packageName}`;

        // Try launching the app
        window.location.replace(appSchemeUrl);

        // If app isn't installed, fallback to the correct Play Store URL after a brief moment
        setTimeout(function() {
          if (!document.hidden) {
            window.location.replace(playStoreUrl);
          }
        }, 1500);
      }
    });
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
