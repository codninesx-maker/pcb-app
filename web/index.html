<script>
  window.addEventListener('DOMContentLoaded', (event) => {
    const hash = window.location.hash;

    // Check if user is on mobile and clicking a post deep link
    if (hash.includes('/post/') && /Android/i.test(navigator.userAgent)) {
      const postId = hash.split('/post/')[1];
      const packageName = 'com.rxai.pcb'; // Your exact package ID
      const playStoreUrl = `https://play.google.com/store/apps/details?id=${packageName}`;

      // Correct Android Intent URI with built-in browser fallback
      // Using a custom scheme 'pcb' or https scheme
      const intentUrl = `intent://codninesx-maker.github.io/pcb-app/#/post/${postId}#Intent;scheme=https;package=${packageName};S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end;`;

      // Trigger navigation
      window.location.replace(intentUrl);
    }
  });
</script>
