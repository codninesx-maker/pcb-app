<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PCB App - Connect with professionals and community posts.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PCB App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PCB App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Smart Deep Link & Play Store Redirection Script for Mobile -->
  <!-- Smart Deep Link & Play Store Redirection Script for Mobile -->
  <!-- Smart Deep Link & Play Store Redirection Script for Mobile -->
  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      const hash = window.location.hash;

      // Check if user is on mobile and clicking a post deep link
      if (hash.includes('/post/') && /Android/i.test(navigator.userAgent)) {
        const postId = hash.split('/post/')[1];
        const packageName = 'com.rxai.pcb'; // Your exact package ID

        // 1. Try launching the app via Android Intent
        const intentUrl = `intent://codninesx-maker.github.io/pcb-app/#/post/${postId}#Intent;scheme=https;package=${packageName};end;`;
        window.location.replace(intentUrl);

        // 2. Fallback to official Play Store listing if the app isn't installed
        setTimeout(function() {
          if (!document.hidden) {
            window.location.href = `https://play.google.com/store/apps/details?id=${packageName}`;
          }
        }, 1200);
      }
    });
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
