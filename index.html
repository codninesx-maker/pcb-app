<!DOCTYPE html>
<html>
<head>
  <!-- Flutter expects this exact placeholder when using --base-href -->
  <base href="/pcb-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PCB App - Connect with professional Pharmacists and their community posts.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PCB App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PCB App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Smart Deep Link & Play Store Redirection Script -->
  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      const hash = window.location.hash;

      // If mobile user clicks a post deep link
      if (hash.includes('/post/') && /Android/i.test(navigator.userAgent)) {
        const postId = hash.split('/post/')[1];
        const packageName = 'com.rxai.pcb';
        const playStoreUrl = `https://play.google.com/store/apps/details?id=${packageName}`;

        // Use custom scheme 'pcb' to bypass domain verification errors
        const intentUrl = `intent://post/${postId}#Intent;scheme=pcb;package=${packageName};S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end;`;

        window.location.replace(intentUrl);
      }
    });
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
